name: Manual native-model benchmarks

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Numerical and timing profile
        type: choice
        options: [smoke, phase, release]
        default: phase

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
      DISABLE_PLOTS: "1"
      JAX_ENABLE_X64: "true"
      JAX_PLATFORM_NAME: cpu
      OMP_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
      POETRY_NO_INTERACTION: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: poetry.lock
      - name: Install locked application dependencies
        run: |
          python -m pip install "poetry==2.2.1"
          poetry check --lock
          poetry install --only main
      - name: Run the selected complete-consumer profile
        # Records actual sources, dependencies, CPU context and numerical gates.
        # No unrelated shared-host stopwatch baseline is imposed on routine CI.
        run: poetry run python benchmark/run.py --profile ${{ inputs.profile }} --samples 12 --output benchmark/results/manual_ci
      - name: Retain complete measurements and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-benchmark-${{ inputs.profile }}
          path: benchmark/results/manual_ci
          retention-days: 30
