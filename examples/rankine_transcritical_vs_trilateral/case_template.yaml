solver_options:
  library: scipy
  method: slsqp
  derivative_method: 2-point
  derivative_abs_step: 0.000001
  print_convergence: false
  plot_convergence: false
  logger: null
  update_on: function
  tolerance: 0.000001
  max_iterations: 200
  problem_scale: 20

problem_formulation:
  cycle_topology: simple
  plot_settings:
    pinch_point_diagram: true
    fluid:
      plot_saturation_line: true
      plot_critical_point: true
      plot_quality_isolines: false
      plot_pseudocritical_line: false
    diagrams:
      - x_prop: s
        y_prop: T
        x_scale: linear
        y_scale: linear
  fixed_parameters:
    working_fluid: {name: null, backend: HEOS, exceptions: true}
    heating_fluid: {name: Water, backend: HEOS, exceptions: true}
    cooling_fluid: {name: Water, backend: HEOS, exceptions: true}
    net_power: 1000000
    special_points:
      ambient_pressure: 101325
      ambient_temperature: 293.15
      maximum_temperature: 413.15
    heat_source:
      inlet_temperature: 413.15
      minimum_temperature: 293.15
      inlet_pressure: 1000000
      exit_pressure: 1000000
    heat_sink:
      inlet_temperature: 293.15
      inlet_pressure: 101325
      exit_pressure: 101325
    heater:
      pressure_drop_hot_side: 0.01
      pressure_drop_cold_side: 0.01
      num_elements: 100
      include_saturation_nodes: false
    cooler:
      pressure_drop_hot_side: 0.01
      pressure_drop_cold_side: 0.01
      num_elements: 100
      include_saturation_nodes: false
    expander: {efficiency: 0.9, efficiency_type: isentropic}
    compressor: {efficiency: 0.7, efficiency_type: isentropic}
    heat_source_pump: {efficiency: 0.7, efficiency_type: isentropic}
    heat_sink_pump: {efficiency: 0.7, efficiency_type: isentropic}
  design_variables:
    heat_source_exit_temperature: {min: null, max: 413.14, value: null}
    heat_sink_exit_temperature: {min: 298.14, max: 298.15, value: 298.145}
    compressor_inlet_pressure: null
    compressor_inlet_enthalpy: null
    expander_inlet_pressure: null
    expander_inlet_enthalpy: null
  constraints:
    - {variable: "$components.heater.temperature_difference", type: ">", value: 5, normalize: true}
    - {variable: "$components.cooler.temperature_difference", type: ">", value: 5, normalize: true}
    - {variable: "$components.compressor.state_in.subcooling", type: ">", value: 1, normalize: true}
    - {variable: "$components.expander.pressure_ratio", type: ">", value: 1.01, normalize: true}
    - variable: $components.expander.specific_work - $components.compressor.specific_work
      type: ">"
      value: 1
      normalize: 10000
    - variable: $components.heater.cold_side.state_out.h - $components.heater.cold_side.state_in.h
      type: ">"
      value: 1
      normalize: 100000
    - variable: $components.cooler.hot_side.state_in.h - $components.cooler.hot_side.state_out.h
      type: ">"
      value: 1
      normalize: 100000
  objective_function: {variable: "$energy_analysis.system_efficiency", type: maximize}
