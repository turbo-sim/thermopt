# Shared inputs. Fluid, topology, property-based bounds and inlet constraints
# are supplied by run_fluid_comparison.py after loading this file.
solver_options:
  library: scipy
  method: slsqp
  derivative_method: 2-point
  derivative_abs_step: 1e-6
  print_convergence: true
  plot_convergence: false
  logger: null
  # Track function evaluations so the native solver retains the final SLSQP
  # point even when convergence occurs without another gradient evaluation.
  update_on: function
  tolerance: 1e-6
  max_iterations: 250
  problem_scale: 20

problem_formulation:
  cycle_topology: null
  plot_settings:
    pinch_point_diagram: true
    fluid:
      plot_saturation_line: true
      plot_critical_point: false
      plot_quality_isolines: false
      plot_pseudocritical_line: false
    diagrams:
      - x_prop: s
        y_prop: T
        x_scale: linear
        y_scale: linear

  fixed_parameters:
    working_fluid:
      name: null
      backend: HEOS
      exceptions: true
    heating_fluid:
      name: Water
      backend: HEOS
      exceptions: true
    cooling_fluid:
      name: Water
      backend: HEOS
      exceptions: true
    # Turbine power minus working-fluid pump power (repository convention).
    net_power: 1.0e6
    special_points:
      ambient_pressure: 101325
      ambient_temperature: 293.15
      maximum_temperature: 413.15
    heat_source:
      inlet_temperature: 413.15
      minimum_temperature: 343.15
      inlet_pressure: 1000000
      exit_pressure: 1000000
    heat_sink:
      inlet_temperature: 293.15
      inlet_pressure: 101325
      exit_pressure: 101325
    heater:
      pressure_drop_hot_side: 0.01
      pressure_drop_cold_side: 0.01
      num_elements: 100
    cooler:
      pressure_drop_hot_side: 0.01
      pressure_drop_cold_side: 0.01
      num_elements: 100
    expander:
      efficiency: 0.90
      efficiency_type: isentropic
    compressor:
      efficiency: 0.7
      efficiency_type: isentropic
    heat_source_pump:
      efficiency: 0.7
      efficiency_type: isentropic
    heat_sink_pump:
      efficiency: 0.7
      efficiency_type: isentropic

  design_variables:
    heat_source_exit_temperature:
      min: 343.15
      # Keep a small temperature drop to avoid a zero-duty source singularity.
      max: 413.14
      value: null
    heat_sink_exit_temperature:
      # Approximately 20 -> 25 degC cooling water; 0.01 K bound width.
      min: 298.14
      max: 298.15
      value: 298.145
    compressor_inlet_pressure: null
    compressor_inlet_enthalpy: null
    expander_inlet_pressure: null
    expander_inlet_enthalpy: null

  constraints:
    - variable: $components.heater.temperature_difference
      type: ">"
      value: 5.0
      normalize: true
    - variable: $components.cooler.temperature_difference
      type: ">"
      value: 5.0
      normalize: true
    - variable: $components.compressor.state_in.subcooling
      type: ">"
      value: 1.0
      normalize: true

  objective_function:
    variable: $energy_analysis.system_efficiency
    type: maximize
