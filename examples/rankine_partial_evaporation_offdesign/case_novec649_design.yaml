# Design of a partial-evaporation ORC (Novec 649, hot-water source).
# run_offdesign.py sizes the off-design hardware from this optimum.

solver_options:
  library: pysolver
  method: slsqp
  derivative_method: 2-point
  derivative_abs_step: 1e-6
  tolerance: 1e-8
  max_iterations: 300
  problem_scale: 1.0
  print_convergence: False
  plot_convergence: False
  update_on: iteration
  extra_options:
    first_step_fraction: 0.2
    max_step_fraction: 1.0
    step_growth_factor: 1.5
    domain_backtracking: True
    feasibility_tol: 1e-6
    optimality_tol: 1e-4
  callbacks:
    save_plot: False
    save_config: False
    save_report: False
    plot_cycle: False
    plot_convergence: False


problem_formulation:

  cycle_topology: simple

  plot_settings:
    pinch_point_diagram: False
    fluid:
      plot_saturation_line: True
      plot_critical_point: True
    diagrams:
      - x_prop: s
        y_prop: T

  fixed_parameters:

    working_fluid:
      name: Novec649
      backend: HEOS
      exceptions: True

    heating_fluid:
      name: water
      backend: HEOS
      exceptions: True

    cooling_fluid:
      name: water
      backend: HEOS
      exceptions: True

    net_power: 1e6                      # W, reference size (scaled away in sizing)

    special_points:
      ambient_pressure: 3.0e5
      ambient_temperature: 293.15  # heat-sink inlet
      maximum_temperature: 413.15 # heat-source inlet

    heat_source:                        # pressurized water, prescribed at the evaporator inlet
      inlet_temperature: 413.15
      minimum_temperature: 298.15
      inlet_pressure: 10.0e5
      exit_pressure: 10.0e5

    heat_sink:                          # cooling water, prescribed at the sink-pump inlet
      inlet_temperature: 293.15
      inlet_pressure: 3.0e5
      exit_pressure: 3.0e5

    heater:
      pressure_drop_hot_side: 0.03
      pressure_drop_cold_side: 0.01
      num_elements: 31                  # nodes (30 elements)
      include_saturation_nodes: True

    cooler:
      pressure_drop_hot_side: 0.01
      pressure_drop_cold_side: 0.10
      num_elements: 31
      include_saturation_nodes: True

    expander:
      efficiency: 0.90
      efficiency_type: isentropic

    compressor:
      efficiency: 0.85
      efficiency_type: isentropic

    heat_source_pump:
      efficiency: 0.80
      efficiency_type: isentropic

    heat_sink_pump:
      efficiency: 0.80
      efficiency_type: isentropic

  design_variables:
    heat_source_exit_temperature:
      min: 298.15
      max: 412.15
      value: 343.15
    heat_sink_exit_temperature:
      min: 296.15
      max: 308.15
      value: 300.15
    compressor_inlet_pressure:
      min: 1.0*$working_fluid.liquid_at_ambient_temperature.p
      max: 4.0*$working_fluid.liquid_at_ambient_temperature.p
      value: 0.50e5
    compressor_inlet_enthalpy:
      min: $working_fluid.liquid_at_ambient_temperature.h - 0.05*($working_fluid.critical_point.h - $working_fluid.liquid_at_ambient_temperature.h)
      max: $working_fluid.liquid_at_ambient_temperature.h + 0.5*($working_fluid.critical_point.h - $working_fluid.liquid_at_ambient_temperature.h)
      value: 232014.83778265282         # 1 K subcooled liquid at 0.50 bar
    expander_inlet_pressure:
      min: 0.10*$working_fluid.critical_point.p
      max: 0.90*$working_fluid.critical_point.p
      value: 8.0e5
    expander_inlet_enthalpy:
      min: $working_fluid.liquid_at_ambient_temperature.h
      max: $working_fluid.gas_at_maximum_temperature.h
      value: 361728.0921517618          # quality 0.30 at 8 bar

  constraints:
    - variable: $components.heater.temperature_difference
      type: ">"
      value: 5.0
      normalize: True
    - variable: $components.cooler.temperature_difference
      type: ">"
      value: 5.0
      normalize: True
    - variable: $components.compressor.state_in.subcooling
      type: "="
      value: 1.0
      normalize: True
    - variable: $components.expander.state_in.Q
      type: ">"
      value: 0.05
      normalize: True
    - variable: $components.expander.state_in.Q
      type: "<"
      value: 0.95
      normalize: True

  objective_function:
    variable: $energy_analysis.system_efficiency
    type: maximize
