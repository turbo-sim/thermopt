# Intentional wet-expansion variant: inlet quality 0.7 at the frozen initial pressure.
solver_options:
  library: scipy
  method: slsqp
  derivative_method: 2-point
  derivative_abs_step: 1e-6
  print_convergence: true
  plot_convergence: false
  logger: None
  update_on: gradient
  tolerance: 1e-6
  max_iterations: 200
  problem_scale: 20
  callbacks:
    save_plot: true
    save_config: true
    save_report: true
    plot_cycle: true
    plot_convergence: false
problem_formulation:
  cycle_topology: simple
  plot_settings:
    pinch_point_diagram: false
    fluid:
      plot_saturation_line: true
      plot_critical_point: true
      plot_quality_isolines: true
      plot_pseudocritical_line: false
      plot_triple_point_liquid: false
      plot_triple_point_vapor: false
    diagrams:
    - x_prop: s
      y_prop: T
      x_scale: linear
      y_scale: linear
  fixed_parameters:
    working_fluid:
      name: butane
      backend: HEOS
      exceptions: true
    heating_fluid:
      name: nitrogen
      backend: HEOS
      exceptions: true
    cooling_fluid:
      name: water
      backend: HEOS
      exceptions: true
    net_power: 1e6
    special_points:
      ambient_pressure: 101325
      ambient_temperature: 20.0 + 273.15
      maximum_temperature: 140.0 + 273.15
    heat_source:
      inlet_temperature: 140 + 273.15
      minimum_temperature: 25 + 273.15
      inlet_pressure: 1*101325
      exit_pressure: 1*101325
    heat_sink:
      inlet_temperature: 20 + 273.15
      inlet_pressure: 101325
      exit_pressure: 101325
    heater:
      pressure_drop_hot_side: 0.01
      pressure_drop_cold_side: 0.01
      num_elements: 25
    cooler:
      pressure_drop_hot_side: 0.01
      pressure_drop_cold_side: 0.01
      num_elements: 25
    expander:
      efficiency: 0.9
      efficiency_type: isentropic
    compressor:
      efficiency: 0.85
      efficiency_type: isentropic
    heat_source_pump:
      efficiency: 0.8
      efficiency_type: isentropic
    heat_sink_pump:
      efficiency: 0.8
      efficiency_type: isentropic
  design_variables:
    heat_source_exit_temperature:
      min: 25 + 273.15
      max: 140 + 273.15
      value: 100 + 273.15
    heat_sink_exit_temperature:
      min: 25 + 273.15
      max: 30 + 273.15
      value: 25 + 273.15
    compressor_inlet_pressure:
      min: 0.9*$working_fluid.liquid_at_ambient_temperature.p
      max: 3.0*$working_fluid.liquid_at_ambient_temperature.p
      value: 2*$working_fluid.liquid_at_ambient_temperature.p
    compressor_inlet_enthalpy:
      min: 0.0*($working_fluid.critical_point.h - $working_fluid.liquid_at_ambient_temperature.h)
        + $working_fluid.liquid_at_ambient_temperature.h
      max: 0.5*($working_fluid.critical_point.h - $working_fluid.liquid_at_ambient_temperature.h)
        + $working_fluid.liquid_at_ambient_temperature.h
      value: 0.1*($working_fluid.critical_point.h - $working_fluid.liquid_at_ambient_temperature.h)
        + $working_fluid.liquid_at_ambient_temperature.h
    expander_inlet_pressure:
      min: 0.1*$working_fluid.triple_point_vapor.p
      max: 3.0*$working_fluid.critical_point.p
      value: 0.5*$working_fluid.critical_point.p
    expander_inlet_enthalpy:
      min: 0.20*$working_fluid.gas_at_maximum_temperature.h
      max: 1.00*$working_fluid.gas_at_maximum_temperature.h
      value: 663101.8631783494
  constraints:
  - variable: $components.heater.temperature_difference
    type: '>'
    value: 5
    normalize: true
  - variable: $components.cooler.temperature_difference
    type: '>'
    value: 5
    normalize: true
  - variable: $components.compressor.state_in.subcooling
    type: '>'
    value: 1.0
    normalize: true
  objective_function:
    variable: $energy_analysis.system_efficiency
    type: maximize
